<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facial Expression Recognition</title>

<style>

:root{
    --bg:#08090b;
    --surface:#111318;
    --surface-2:#17191f;
    --surface-3:#1d2027;
    --border:rgba(255,255,255,.09);
    --border-hover:rgba(255,255,255,.18);
    --text:#f5f5f7;
    --muted:#a0a2aa;
    --muted-2:#737680;
    --white:#fff;
    --shadow:0 24px 70px rgba(0,0,0,.38);
    --radius:20px;
    --transition:180ms ease;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
    margin:0;
    min-height:100vh;
    background:
        radial-gradient(700px 380px at 50% -80px,rgba(255,255,255,.075),transparent 70%),
        radial-gradient(500px 300px at 8% 35%,rgba(255,255,255,.025),transparent 70%),
        linear-gradient(180deg,#0a0b0e 0%,#08090b 100%);
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
}

body>h1,
body>.card,
body>section,
body>main{
    width:min(1080px,calc(100% - 32px));
    margin-left:auto;
    margin-right:auto;
}

body>h1{
    margin-top:54px;
    margin-bottom:12px;
    text-align:center;
    font-size:clamp(2.15rem,5vw,3.7rem);
    line-height:1.03;
    letter-spacing:-.055em;
    font-weight:780;
}

body>h1::after{
    content:"";
    display:block;
    width:68px;
    height:2px;
    margin:20px auto 0;
    background:linear-gradient(90deg,transparent,var(--white),transparent);
    opacity:.55;
}

body::before{
    content:"AI-POWERED • REAL-TIME FACIAL EXPRESSION RECOGNITION";
    display:block;
    width:fit-content;
    max-width:calc(100% - 32px);
    margin:28px auto 0;
    padding:7px 12px;
    border:1px solid var(--border);
    border-radius:999px;
    color:var(--muted);
    background:rgba(255,255,255,.025);
    font-size:.69rem;
    font-weight:700;
    letter-spacing:.13em;
    text-align:center;
}

/* Attractive project summary inserted above the controls */
body>h1::before{
    content:"Detect facial emotions from images, videos, or your webcam — with confidence scores and instant visual results.";
    display:block;
    max-width:650px;
    margin:0 auto 18px;
    color:var(--muted);
    font-size:.98rem;
    line-height:1.65;
    font-weight:450;
    letter-spacing:0;
}

.card{
    margin-top:20px;
    margin-bottom:22px;
    padding:26px;
    background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.card h3{
    margin:0 0 18px;
    font-size:1.05rem;
    letter-spacing:-.015em;
}

.upload-row{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:20px;
    border:1px dashed var(--border-hover);
    border-radius:16px;
    background:rgba(255,255,255,.018);
}

#fileInput{
    min-width:260px;
    max-width:500px;
    padding:10px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--surface-2);
    color:var(--muted);
}

#fileInput::file-selector-button{
    margin-right:10px;
    padding:9px 13px;
    border:0;
    border-radius:9px;
    background:var(--white);
    color:#090a0c;
    font-weight:700;
    cursor:pointer;
}

button{
    appearance:none;
    border:1px solid transparent;
    border-radius:11px;
    padding:10px 16px;
    background:var(--white);
    color:#090a0c;
    font:inherit;
    font-size:.9rem;
    font-weight:700;
    cursor:pointer;
    transition:transform var(--transition),box-shadow var(--transition),background var(--transition),border-color var(--transition);
}

button:hover{
    transform:translateY(-1px);
    box-shadow:0 10px 28px rgba(0,0,0,.3);
}

button:active{transform:translateY(0)}

#webcamButton{
    display:block;
    margin:0 auto 14px;
    min-width:145px;
}

button[onclick="capturePredict()"]{
    min-width:145px;
    height:44px;
    padding:0 19px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:14px auto 0;
    border:0;
    border-radius:999px;
    background:linear-gradient(135deg,#7c3aed 0%,#2563eb 52%,#06b6d4 100%);
    color:#fff;
    font-size:.9rem;
    font-weight:750;
    letter-spacing:.01em;
    box-shadow:0 10px 30px rgba(37,99,235,.24);
    vertical-align:middle;
}

button[onclick="capturePredict()"]:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 34px rgba(124,58,237,.32);
    filter:saturate(1.12);
}

button[onclick="capturePredict()"]::first-letter{
    font-size:1.05rem;
}

#camera{
    display:none;
    width:min(760px,100%);
    max-height:520px;
    margin:16px auto 0;
    aspect-ratio:16/9;
    object-fit:cover;
    border:1px solid var(--border);
    border-radius:16px;
    background:#050506;
    box-shadow:0 18px 50px rgba(0,0,0,.42);
}

#canvas{display:none}

#preview,
#videoResult{
    display:block;
    width:min(900px,100%);
    max-height:650px;
    object-fit:contain;
    margin:4px auto 18px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#050506;
    box-shadow:0 18px 50px rgba(0,0,0,.36);
}

#preview:before{content:""}

#videoResult{min-height:180px}

#results{
    width:min(760px,100%);
    margin:0 auto;
}

.result{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin:9px 0;
    padding:13px 15px;
    background:rgba(255,255,255,.025);
    border:1px solid var(--border);
    border-radius:12px;
    color:var(--muted);
}

.result b{color:var(--text)}

.status{
    min-height:22px;
    margin:12px auto 0;
    text-align:center;
    color:var(--muted);
    font-size:.88rem;
    font-weight:550;
}

#preview[src=""]{
    display:none;
}


/* ---------- Processing overlay ---------- */

.processing-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(4,5,7,.82);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
}

.processing-overlay.active{
    display:flex;
}

.processing-box{
    width:min(380px,100%);
    padding:30px 26px;
    text-align:center;
    background:linear-gradient(145deg,rgba(28,30,37,.97),rgba(14,15,19,.97));
    border:1px solid rgba(255,255,255,.12);
    border-radius:22px;
    box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.processing-spinner{
    width:46px;
    height:46px;
    margin:0 auto 18px;
    border:3px solid rgba(255,255,255,.13);
    border-top-color:#8b5cf6;
    border-right-color:#06b6d4;
    border-radius:50%;
    animation:processing-spin .8s linear infinite;
}

@keyframes processing-spin{
    to{transform:rotate(360deg)}
}

.processing-box h3{
    margin:0 0 7px;
    color:#fff;
    font-size:1.1rem;
}

.processing-box p{
    margin:0;
    color:#a0a2aa;
    font-size:.88rem;
}

.processing-box .processing-sub{
    margin-top:12px;
    color:#737680;
    font-size:.76rem;
}

/* Keep capture button visually disabled while prediction is running */
button.processing-disabled{
    opacity:.55;
    pointer-events:none;
}

@media(max-width:700px){
    body>h1,
    body>.card,
    body>section,
    body>main{
        width:min(100% - 20px,600px);
    }

    body>h1{
        margin-top:38px;
        font-size:2.15rem;
    }

    body>h1::before{
        font-size:.9rem;
        padding-inline:8px;
    }

    .card{padding:18px}

    .upload-row{
        padding:15px;
    }

    #fileInput{
        width:100%;
        min-width:0;
    }

    .upload-row button{
        width:100%;
    }

    .result{
        align-items:flex-start;
    }
}

@media(prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    *,*::before,*::after{
        transition:none!important;
        animation:none!important;
    }
}

</style>
</head>

<body>
<div id="processingOverlay" class="processing-overlay" aria-live="polite" aria-busy="true">
    <div class="processing-box">
        <div class="processing-spinner"></div>
        <h3 id="processingTitle">Analyzing your image...</h3>
        <p id="processingMessage">Capturing and predicting the facial expression.</p>
        <p class="processing-sub">Please wait — your result will appear automatically.</p>
    </div>
</div>


<h1>Facial Expression Recognition</h1>

<div class="card">
    <h3>Upload Image or Video</h3>

    <div class="upload-row">
        <input
            id="fileInput"
            type="file"
            accept="image/*,video/*"
        >

        <button onclick="processUpload()">
            Predict
        </button>
    </div>

    <div id="uploadStatus" class="status"></div>
</div>

<div class="card">
    <h3>Webcam</h3>

    <button id="webcamButton" onclick="toggleWebcam()">
        Start Webcam
    </button>

    <button onclick="capturePredict()" title="Capture and predict">
        <span aria-hidden="true">📷</span>
        <span>Capture</span>
    </button>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div class="card">
    <img id="preview" alt="Prediction result">
    <video id="videoResult" controls style="display:none"></video>

    <div id="results"></div>
</div>

<script>
let stream = null;

async function processUpload() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("uploadStatus");

    if (!input.files.length) {
        alert("Please choose an image or video first.");
        return;
    }

    const file = input.files[0];

    if (file.type.startsWith("image/")) {
        status.textContent = "Processing image...";
        const overlay = document.getElementById("processingOverlay");
        const title = document.getElementById("processingTitle");
        const message = document.getElementById("processingMessage");

        title.textContent = "Analyzing your image...";
        message.textContent = "Running facial detection and emotion prediction.";
        overlay.classList.add("active");

        try {
            await sendImage(file, "upload");
            status.textContent = "Image prediction completed.";
        } catch (error) {
            status.textContent = "";
            alert(error.message);
        } finally {
            overlay.classList.remove("active");
        }

        return;
    }

    if (file.type.startsWith("video/")) {
        status.textContent = "Processing video... Please wait.";

        const overlay = document.getElementById("processingOverlay");
        const title = document.getElementById("processingTitle");
        const message = document.getElementById("processingMessage");

        title.textContent = "Processing video...";
        message.textContent = "Analyzing selected frames and creating the result.";
        overlay.classList.add("active");

        const form = new FormData();
        form.append("file", file);

        try {
            const response = await fetch("/predict-video", {
                method: "POST",
                body: form
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Video processing failed.");
            }

            status.textContent =
                `Done. Processed ${data.frames_processed} frames.`;

            const video = document.getElementById("videoResult");
            video.src = data.video_url;
            video.style.display = "block";
            video.load();

        } catch (error) {
            status.textContent = "";
            alert(error.message);
        } finally {
            overlay.classList.remove("active");
        }

        return;
    }

    alert("Please select an image or video.");
}


async function sendImage(blob, source) {
    const form = new FormData();
    form.append("file", blob, source + ".jpg");

    const response = await fetch(
        "/predict?source=" + encodeURIComponent(source),
        {
            method: "POST",
            body: form
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.detail || "Prediction failed.");
    }

    showResults(data);
    return data;
}


function showResults(data) {
    const results = document.getElementById("results");
    const video = document.getElementById("videoResult");
    const preview = document.getElementById("preview");

    video.style.display = "none";

    // Show the server-generated prediction image only after
    // face detection + emotion inference has completed.
    if (data.predicted_url) {
        preview.src = data.predicted_url;
        preview.style.display = "block";
    } else if (data.predicted_filename) {
        preview.src = "/predicted_images/" + encodeURIComponent(data.predicted_filename);
        preview.style.display = "block";
    } else if (data.filename) {
        preview.src = "/predicted_images/" + encodeURIComponent(data.filename);
        preview.style.display = "block";
    }

    if (!data.faces || !data.faces.length) {
        results.innerHTML = "<p class=\"result\">No face detected.</p>";
        return;
    }

    results.innerHTML = data.faces.map((face, i) =>
        `<div class="result">
            <b>Face ${i + 1}</b>
            <span>${face.expression} — ${(face.confidence * 100).toFixed(1)}%</span>
        </div>`
    ).join("");
}


async function toggleWebcam() {
    const button = document.getElementById("webcamButton");
    const camera = document.getElementById("camera");

    if (stream) {
        stopWebcam();
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        camera.srcObject = stream;
        camera.style.display = "block";
        button.textContent = "Stop Webcam";

    } catch (error) {
        alert("Could not access webcam: " + error.message);
    }
}


async function capturePredict() {
    if (!stream) {
        alert("Start the webcam first.");
        return;
    }

    const camera = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const captureButton = document.querySelector('button[onclick="capturePredict()"]');

    if (!camera.videoWidth || !camera.videoHeight) {
        alert("Camera is not ready yet. Please wait a moment.");
        return;
    }

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    // Do NOT display the raw captured frame.
    // The final prediction image is shown only after the API responds.
    const overlay = document.getElementById("processingOverlay");
    const title = document.getElementById("processingTitle");
    const message = document.getElementById("processingMessage");

    title.textContent = "Analyzing your image...";
    message.textContent = "Running facial detection and emotion prediction.";
    overlay.classList.add("active");
    captureButton.classList.add("processing-disabled");
    captureButton.disabled = true;

    canvas.toBlob(async blob => {
        try {
            await sendImage(blob, "webcam");
        } catch (error) {
            alert(error.message);
        } finally {
            overlay.classList.remove("active");
            captureButton.classList.remove("processing-disabled");
            captureButton.disabled = false;
        }
    }, "image/jpeg", 0.92);
}


function stopWebcam() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    const camera = document.getElementById("camera");
    const button = document.getElementById("webcamButton");

    camera.srcObject = null;
    camera.style.display = "none";
    button.textContent = "Start Webcam";
}
</script>

</body>
</html>
