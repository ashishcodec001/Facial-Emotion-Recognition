<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facial Expression Recognition</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
    background: #f5f5f5;
    color: #222;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px #0001;
}

button {
    padding: 10px 16px;
    margin: 5px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
}

button:hover {
    opacity: 0.9;
}

.upload-row {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
}

#fileInput {
    max-width: 100%;
}

#camera {
    display: none;
    width: 100%;
    max-width: 700px;
    margin-top: 15px;
    border-radius: 10px;
}

#preview,
#videoResult {
    max-width: 100%;
    border-radius: 10px;
}

#canvas {
    display: none;
}

.result {
    padding: 10px;
    margin: 8px 0;
    background: #f0f0f0;
    border-radius: 8px;
}

.status {
    margin: 10px 0;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>Facial Expression Recognition</h1>

<div class="card">
    <h3>Upload Image or Video</h3>

    <div class="upload-row">
        <input
            id="fileInput"
            type="file"
            accept="image/*,video/*"
        >

        <button onclick="processUpload()">
            Predict
        </button>
    </div>

    <div id="uploadStatus" class="status"></div>
</div>

<div class="card">
    <h3>Webcam</h3>

    <button id="webcamButton" onclick="toggleWebcam()">
        Start Webcam
    </button>

    <button onclick="capturePredict()" title="Capture and predict">
        📷
    </button>

    <video id="camera" autoplay playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div class="card">
    <img id="preview" alt="Prediction result">
    <video id="videoResult" controls style="display:none"></video>

    <div id="results"></div>
</div>

<script>
let stream = null;

async function processUpload() {
    const input = document.getElementById("fileInput");
    const status = document.getElementById("uploadStatus");

    if (!input.files.length) {
        alert("Please choose an image or video first.");
        return;
    }

    const file = input.files[0];

    if (file.type.startsWith("image/")) {
        status.textContent = "Processing image...";

        try {
            await sendImage(file, "upload");
            status.textContent = "Image prediction completed.";
        } catch (error) {
            status.textContent = "";
            alert(error.message);
        }

        return;
    }

    if (file.type.startsWith("video/")) {
        status.textContent = "Processing video... Please wait.";

        const form = new FormData();
        form.append("file", file);

        try {
            const response = await fetch("/predict-video", {
                method: "POST",
                body: form
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.detail || "Video processing failed.");
            }

            status.textContent =
                `Done. Processed ${data.frames_processed} frames.`;

            const video = document.getElementById("videoResult");
            video.src = data.video_url;
            video.style.display = "block";
            video.load();

        } catch (error) {
            status.textContent = "";
            alert(error.message);
        }

        return;
    }

    alert("Please select an image or video.");
}


async function sendImage(blob, source) {
    const form = new FormData();
    form.append("file", blob, source + ".jpg");

    const response = await fetch(
        "/predict?source=" + encodeURIComponent(source),
        {
            method: "POST",
            body: form
        }
    );

    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.detail || "Prediction failed.");
    }

    showResults(data);
}


function showResults(data) {
    const results = document.getElementById("results");
    const video = document.getElementById("videoResult");

    video.style.display = "none";

    if (!data.faces.length) {
        results.innerHTML = "<p>No face detected.</p>";
        return;
    }

    results.innerHTML = data.faces.map((face, i) =>
        `<div class="result">
            <b>Face ${i + 1}</b>:
            ${face.expression}
            —
            ${(face.confidence * 100).toFixed(1)}%
        </div>`
    ).join("");
}


async function toggleWebcam() {
    const button = document.getElementById("webcamButton");
    const camera = document.getElementById("camera");

    if (stream) {
        stopWebcam();
        return;
    }

    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: true
        });

        camera.srcObject = stream;
        camera.style.display = "block";
        button.textContent = "Stop Webcam";

    } catch (error) {
        alert("Could not access webcam: " + error.message);
    }
}


async function capturePredict() {
    if (!stream) {
        alert("Start the webcam first.");
        return;
    }

    const camera = document.getElementById("camera");
    const canvas = document.getElementById("canvas");

    if (!camera.videoWidth || !camera.videoHeight) {
        alert("Camera is not ready yet. Please wait a moment.");
        return;
    }

    canvas.width = camera.videoWidth;
    canvas.height = camera.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(camera, 0, 0);

    document.getElementById("preview").src =
        canvas.toDataURL("image/jpeg");

    canvas.toBlob(async blob => {
        try {
            await sendImage(blob, "webcam");
        } catch (error) {
            alert(error.message);
        }
    }, "image/jpeg", 0.95);
}


function stopWebcam() {
    if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
    }

    const camera = document.getElementById("camera");
    const button = document.getElementById("webcamButton");

    camera.srcObject = null;
    camera.style.display = "none";
    button.textContent = "Start Webcam";
}
</script>

</body>
</html>
